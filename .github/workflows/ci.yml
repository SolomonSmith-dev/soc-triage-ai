name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Engine unit tests (extractors / case_package / evaluation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install triage-engine + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts
          pip install -e services/triage-worker
          pip install -e apps/demo
          pip install pytest

      - name: Run engine unit tests
        run: pytest tests/unit -v

  api-tests:
    name: API unit tests (security / auth / services)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc
          POSTGRES_DB: soc_triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install soc-api and local packages
        run: |
          python -m pip install --upgrade pip
          pip install greenlet
          pip install -e packages/contracts
          pip install -e services/triage-worker
          pip install -e apps/api
          pip install pytest pytest-asyncio httpx

      - name: Run API unit tests
        run: pytest apps/api/tests -v

  harness-replay:
    name: Harness replay gate (offline, no API key)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install triage-engine + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e services/triage-worker
          pip install pytest

      - name: Validate cases
        run: python -m tests.harness.loader --validate

      - name: Replay gate
        env:
          HARNESS_REQUIRE_RETRIEVER: "1"
        run: pytest tests/harness/test_replay_ci.py -v -s

  retrieval-eval:
    name: Retrieval metrics (local embeddings, no API key)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install triage-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e services/triage-worker

      - name: Compute retrieval metrics
        run: python -m tests.harness.retrieval_eval --out retrieval_report.json --print-json

      - name: Check committed results still match
        run: |
          if [ -f tests/harness/retrieval_results.json ]; then
            python -m tests.harness.retrieval_eval --check tests/harness/retrieval_results.json
          else
            echo "no committed retrieval_results.json yet"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: retrieval_report.json

  demo-image:
    name: Public demo image builds and serves (no API key)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the Space image from this checkout
        run: docker build -f deploy/hf-space/Dockerfile --build-arg SOURCE=local -t soc-demo .

      - name: Image size
        run: docker image ls soc-demo --format '{{.Size}}'

      - name: Smoke test, cap of zero tokens
        run: |
          docker run -d --name demo -p 7860:7860 -e DEMO_DAILY_TOKEN_CAP=0 soc-demo
          for i in $(seq 1 60); do curl -fs localhost:7860/healthz && break; sleep 2; done
          curl -fs localhost:7860/healthz
          curl -fs localhost:7860/budget
          curl -fs -o /dev/null localhost:7860/
          code=$(curl -s -o body.json -w '%{http_code}' -X POST localhost:7860/triage -H 'content-type: application/json' -d '{"alert":"canary-9f3a failed ssh logins from 203.0.113.9"}')
          cat body.json; echo
          test "$code" = "429"
          grep -q demo_budget_reached body.json
          # the alert text must not appear anywhere in the container logs
          if docker logs demo 2>&1 | grep -q canary-9f3a; then echo "alert text leaked into logs"; exit 1; fi
          docker rm -f demo

      - name: Smoke test, no key configured
        run: |
          docker run -d --name demo2 -p 7861:7860 soc-demo
          for i in $(seq 1 60); do curl -fs localhost:7861/healthz && break; sleep 2; done
          code=$(curl -s -o body2.json -w '%{http_code}' -X POST localhost:7861/triage -H 'content-type: application/json' -d '{"alert":"canary-9f3a failed ssh logins"}')
          cat body2.json; echo
          test "$code" = "503"
          if docker logs demo2 2>&1 | grep -q canary-9f3a; then echo "alert text leaked into logs"; exit 1; fi
