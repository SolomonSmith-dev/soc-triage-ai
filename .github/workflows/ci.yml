name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Engine unit tests (extractors / case_package / evaluation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install triage-engine + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e services/triage-worker
          pip install pytest

      - name: Run engine unit tests
        run: pytest tests/unit -v

  api-tests:
    name: API unit tests (security / auth / services)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc
          POSTGRES_DB: soc_triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install soc-api and local packages
        run: |
          python -m pip install --upgrade pip
          pip install greenlet
          pip install -e packages/contracts
          pip install -e services/triage-worker
          pip install -e apps/api
          pip install pytest pytest-asyncio httpx

      - name: Run API unit tests
        run: pytest apps/api/tests -v
