name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Engine unit tests (extractors / case_package / evaluation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install triage-engine + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts
          pip install -e services/triage-worker
          pip install -e "apps/demo[ui,space]"   # streamlit and gradio, for the page tests
          pip install pytest

      - name: Run engine unit tests
        run: pytest tests/unit packages/contracts/tests -v

  api-tests:
    name: API unit tests (security / auth / services)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc
          POSTGRES_DB: soc_triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install soc-api and local packages
        run: |
          python -m pip install --upgrade pip
          pip install greenlet
          pip install -e packages/contracts
          pip install -e services/triage-worker
          pip install -e apps/api
          pip install pytest pytest-asyncio httpx

      - name: Run API unit tests
        run: pytest apps/api/tests -v

  harness-replay:
    name: Harness replay gate (offline, no API key)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install triage-engine, demo + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts -e services/triage-worker -e apps/demo
          pip install pytest

      - name: Validate cases
        run: python -m tests.harness.loader --validate

      - name: Replay gate
        env:
          HARNESS_REQUIRE_RETRIEVER: "1"
        run: pytest tests/harness/test_replay_ci.py -v -s

      - name: Demo cached-mode gate (every cassette replays through the public demo API)
        env:
          HARNESS_REQUIRE_RETRIEVER: "1"
        run: pytest tests/harness/test_demo_replay_ci.py -v -s

  retrieval-eval:
    name: Retrieval metrics (local embeddings, no API key)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install triage-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e services/triage-worker

      - name: Compute retrieval metrics
        run: python -m tests.harness.retrieval_eval --out retrieval_report.json --print-json

      - name: Check committed results still match
        run: |
          if [ -f tests/harness/retrieval_results.json ]; then
            python -m tests.harness.retrieval_eval --check tests/harness/retrieval_results.json
          else
            echo "no committed retrieval_results.json yet"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: retrieval_report.json

  demo-image:
    name: Public demo image builds and serves, cached and live modes (no API key)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the Space image from this checkout
        run: docker build -f deploy/hf-space/Dockerfile --build-arg SOURCE=local -t soc-demo .

      - name: Image size
        run: docker image ls soc-demo --format '{{.Size}}'

      - name: Smoke test, cached mode (the default, no key)
        run: |
          docker run -d --name demo -p 7860:7860 soc-demo
          for i in $(seq 1 90); do curl -fs localhost:7860/healthz | grep -q '"replay"' && break; sleep 2; done
          curl -fs localhost:7860/healthz; echo
          curl -fs localhost:7860/budget; echo
          for i in $(seq 1 30); do curl -fs -o /dev/null localhost:7860/ && break; sleep 1; done
          curl -fs -o /dev/null localhost:7860/
          python3 - <<'PY'
          import glob, json, urllib.error, urllib.request
          U = "http://localhost:7860"

          def post(alert):
              req = urllib.request.Request(U + "/triage", data=json.dumps({"alert": alert}).encode(),
                                           headers={"content-type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.headers, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, json.load(e)

          health = json.load(urllib.request.urlopen(U + "/healthz"))
          cassettes = len(glob.glob("tests/harness/cassettes/*.json"))
          assert health["mode"] == "cached" and health["recordings"]["replay"] == cassettes, (health, cassettes)
          samples = {s["id"]: s for s in json.load(urllib.request.urlopen(U + "/samples"))}
          code, h, body = post(samples["T4_brute_force_ssh"]["alert"])
          assert code == 200 and h.get("X-Demo-Replay-Case") == "T4_brute_force_ssh", (code, dict(h), body)
          assert body["case_id"].startswith("SOC-") and body["guardrail_triggered"] is False, body
          code, h, body = post(samples["OOC-004"]["alert"])
          assert code == 200 and body["guardrail_triggered"] and not body["evidence"]["chunks_retrieved"], body
          code, h, body = post("canary-9f3a 5000 failed ssh logins from 203.0.113.9 against srv-bastion-01 overnight")
          assert code == 404 and body["status"] == "not_recorded", (code, body)
          # bodies FastAPI's default handler would echo into a 500 and the log: a lone surrogate, NaN
          for raw in (b'{"alert": "canary-5e1d \\udc9f"}', b'{"alert": NaN}'):
              req = urllib.request.Request(U + "/triage", data=raw, headers={"content-type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=60)
                  raise AssertionError("invalid body accepted")
              except urllib.error.HTTPError as e:
                  assert e.code == 422 and json.load(e)["status"] == "invalid_request", e.code
          print("cached mode ok:", json.dumps(health["recordings"]))
          PY
          # Neither a visitor's alert nor a recorded one may reach the container logs. The engine's own messages
          # (refusal, model failure) only appear if redaction failed, and the uvicorn line only if an error escaped.
          if docker logs demo 2>&1 | grep -E 'canary-9f3a|canary-5e1d|185\.220\.101\.45|No corpus matches for alert|Triage failed:|JSON parse failed|Exception in ASGI application'; then echo "alert text or an unhandled error reached the logs"; exit 1; fi
          docker rm -f demo

      - name: Smoke test, live mode with a cap of zero tokens
        run: |
          docker run -d --name demo2 -p 7861:7860 -e DEMO_MODE=live -e DEMO_DAILY_TOKEN_CAP=0 soc-demo
          for i in $(seq 1 60); do curl -fs localhost:7861/healthz && break; sleep 2; done
          curl -fs localhost:7861/healthz | grep -q '"mode":"live"'
          curl -fs localhost:7861/budget
          code=$(curl -s -o body.json -w '%{http_code}' -X POST localhost:7861/triage -H 'content-type: application/json' -d '{"alert":"canary-9f3a failed ssh logins from 203.0.113.9"}')
          cat body.json; echo
          test "$code" = "429"
          grep -q demo_budget_reached body.json
          if docker logs demo2 2>&1 | grep -q canary-9f3a; then echo "alert text leaked into logs"; exit 1; fi
          docker rm -f demo2

      - name: Smoke test, live mode with no key configured
        run: |
          docker run -d --name demo3 -p 7862:7860 -e DEMO_MODE=live soc-demo
          for i in $(seq 1 60); do curl -fs localhost:7862/healthz && break; sleep 2; done
          code=$(curl -s -o body3.json -w '%{http_code}' -X POST localhost:7862/triage -H 'content-type: application/json' -d '{"alert":"canary-9f3a failed ssh logins"}')
          cat body3.json; echo
          test "$code" = "503"
          if docker logs demo3 2>&1 | grep -q canary-9f3a; then echo "alert text leaked into logs"; exit 1; fi

  space-app:
    name: ZeroGPU Space app serves cached mode (Gradio, emulated ZeroGPU, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Bundle the Space from this commit
        run: python deploy/hf-space-zerogpu/bundle.py "$(git rev-parse HEAD)" "$RUNNER_TEMP/space"

      - name: Install what the Space installs, from the bundle's requirements.txt
        run: |
          python -m pip install --upgrade pip
          # The Space installs the app from GitHub archives of the pinned commit; an archive of this commit stands in
          # for them, so the #subdirectory references are the ones under test. torch comes from PyPI, as there.
          sha=$(git rev-parse HEAD)
          git archive --format=tar.gz --prefix=soc-triage-ai/ HEAD > "$RUNNER_TEMP/src.tar.gz"
          sed "s#https://github.com/SolomonSmith-dev/soc-triage-ai/archive/$sha.tar.gz#file://$RUNNER_TEMP/src.tar.gz#" \
            "$RUNNER_TEMP/space/requirements.txt" > "$RUNNER_TEMP/requirements-ci.txt"
          test "$(grep -c " @ file://$RUNNER_TEMP/src.tar.gz#subdirectory=" "$RUNNER_TEMP/requirements-ci.txt")" = 3
          # The rest of Hugging Face's ZeroGPU install line, from the Space's build log: Gradio at sdk_version, and
          # spaces pinned to 0.51.3, which sends ZeroGPU's startup report only from demo.launch()
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" "torch<=2.13.0" \
            "gradio[oauth,mcp]==$(sed -n 's/^sdk_version: //p' "$RUNNER_TEMP/space/README.md")" \
            "uvicorn>=0.14.0" "websockets>=10.4" spaces==0.51.3

      - name: A failed ZeroGPU startup report stops the app
        run: |
          python -c "
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def fail(self):
                  self.send_response(500); self.end_headers(); self.wfile.write(b'{}')
              do_GET = do_POST = fail
              def log_message(self, *a): pass
          HTTPServer(('127.0.0.1', 7898), H).serve_forever()" &
          cd "$RUNNER_TEMP/space"
          code=0
          SPACES_ZERO_GPU=true SPACES_ZERO_DEVICE_API_URL=http://127.0.0.1:7898 GRADIO_SERVER_PORT=7861 \
            timeout 180 python app.py > "$RUNNER_TEMP/fail.log" 2>&1 || code=$?
          tail -5 "$RUNNER_TEMP/fail.log"
          # exit 124 would mean it was still serving, with a page whose queue never started, when timeout stopped it
          test "$code" -ne 0 && test "$code" -ne 124

      - name: Smoke test under emulated ZeroGPU (CUDA emulation on, stub device API)
        run: |
          # ZeroGPU sets SPACES_ZERO_GPU and serves a device API; `import spaces` then patches torch to emulate CUDA
          python -c "
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def ok(self):
                  print(self.command, self.path, flush=True)
                  self.send_response(200); self.end_headers(); self.wfile.write(b'{}')
              do_GET = do_POST = ok
              def log_message(self, *a): pass
          HTTPServer(('127.0.0.1', 7899), H).serve_forever()" > "$RUNNER_TEMP/device-api.log" 2>&1 &
          cd "$RUNNER_TEMP/space"
          trap 'echo "--- app log"; tail -60 "$RUNNER_TEMP/space.log"; echo "--- device API"; cat "$RUNNER_TEMP/device-api.log"' ERR
          # unbuffered, so anything the app print()s is in the log when the leak grep below reads it
          PYTHONUNBUFFERED=1 SPACES_ZERO_GPU=true SPACES_ZERO_DEVICE_API_URL=http://127.0.0.1:7899 \
            python app.py > "$RUNNER_TEMP/space.log" 2>&1 &
          for i in $(seq 1 90); do curl -fs localhost:7860/healthz | grep -q '"replay"' && break; sleep 2; done
          curl -fs localhost:7860/healthz; echo
          curl -fs localhost:7860/ | grep -qi gradio
          curl -fsI localhost:7860/ | grep -qi "^content-security-policy: img-src 'self'"
          timeout 300 python3 - <<'PY'
          import glob, http.client, json, urllib.error, urllib.request
          from gradio_client import Client
          U = "http://localhost:7860"

          def request(path, data=None, ctype="application/json", timeout=60):
              req = urllib.request.Request(U + path, data=data, headers={"content-type": ctype})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.headers, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read()

          def post(data):
              code, h, raw = request("/triage", data)
              return code, h, json.loads(raw)

          health = json.load(urllib.request.urlopen(U + "/healthz"))
          cassettes = len(glob.glob("tests/harness/cassettes/*.json"))
          assert health["mode"] == "cached" and health["recordings"]["replay"] == cassettes, (health, cassettes)
          samples = {s["id"]: s for s in json.load(urllib.request.urlopen(U + "/samples"))}
          code, h, body = post(json.dumps({"alert": samples["T4_brute_force_ssh"]["alert"]}).encode())
          assert code == 200 and h.get("X-Demo-Replay-Case") == "T4_brute_force_ssh", (code, body)
          code, h, body = post(json.dumps({"alert": samples["OOC-004"]["alert"]}).encode())
          assert code == 200 and body["guardrail_triggered"] and not body["evidence"]["chunks_retrieved"], body
          code, h, body = post(b'{"alert": "canary-9f3a 5000 failed ssh logins from 203.0.113.9 against srv-bastion-01"}')
          assert code == 404 and body["status"] == "not_recorded", (code, body)
          for raw in (b'{"alert": "canary-5e1d \\udc9f"}', b'{"alert": NaN}'):
              code, h, body = post(raw)
              assert code == 422 and body["status"] == "invalid_request", (code, body)
          assert request("/triage", b'{"alert": "' + b"a" * 300_000 + b'"}')[0] == 413

          # the page's own endpoint: same API in process, and a whitespace-only edit keeps the recording
          result, evidence, case_json = Client(U + "/", verbose=False).submit(
              samples["T4_brute_force_ssh"]["alert"] + "\n\n", api_name="/run_triage").result(timeout=120)
          assert "replayed from the harness recording of case `T4_brute_force_ssh`" in result, result[:300]

          # the page's routes follow the API's logging rules: malformed or mismatched calls log no request text
          for path in ("/gradio_api/queue/join", "/gradio_api/call/run_triage"):
              for raw in (b'{"data": "canary-7c1d \\udc9f", "fn_index": 0, "session_hash": "ci"}',
                          b'{"data": {"alert": "canary-7c1d", "n": NaN}, "fn_index": 0, "session_hash": "ci"}'):
                  code, h, text = request(path, raw)
                  assert code == 422 and b"canary" not in text, (path, code, text[:200])

          def call(data):
              code, h, text = request("/gradio_api/call/run_triage", json.dumps({"data": data}).encode())
              assert code == 200, (code, text[:200])
              event = json.loads(text)["event_id"]
              return request(f"/gradio_api/call/run_triage/{event}", timeout=120)[2].decode()

          assert "event: complete" in call(["canary-7c1e 900 failed ssh logins from 203.0.113.9", "extra"])
          assert "event: error" in call([])  # too few inputs: Gradio's error, which the app logs by type only

          config = json.load(urllib.request.urlopen(U + "/config"))
          chooser = next(c["id"] for c in config["components"] if c.get("type") == "dropdown")
          fn = next(d["id"] for d in config["dependencies"] if d["inputs"] == [chooser])
          code, h, text = request("/gradio_api/queue/join", json.dumps(
              {"data": ["canary-7c1f not a case id"], "fn_index": fn, "session_hash": "ci-chooser"}).encode())
          assert code == 200, (code, text[:200])
          with urllib.request.urlopen(U + "/gradio_api/queue/data?session_hash=ci-chooser", timeout=60) as r:
              for line in r:
                  if b"process_completed" in line:
                      break
          try:  # what a stale tab sends after a restart; the stream may end early, the log is what is checked
              request("/gradio_api/queue/data?session_hash=ci-unknown", timeout=10)
          except (OSError, http.client.HTTPException):
              pass

          # nothing takes files: multipart bodies are refused before Gradio's file routes write temp files
          boundary = "ci-boundary"
          for route, field in (("/gradio_api/upload", "files"), ("/gradio_api/process_recording", "video")):
              part = (f'--{boundary}\r\nContent-Disposition: form-data; name="{field}"; filename="x.bin"\r\n\r\n'
                      .encode() + b"0" * 200 + f"\r\n--{boundary}--\r\n".encode())
              assert request(route, part, f"multipart/form-data; boundary={boundary}")[0] == 415, route
          # Gradio print()s this route's path parameters; the app silences that print
          assert request("/gradio_api/custom_component/canary-7c20/client/js/canary-7c20.js")[0] == 404

          # one address cannot fill the queue every visitor shares: page events are limited per address
          join = json.dumps({"data": [], "fn_index": 0, "session_hash": "ci-flood"}).encode()
          codes = [request("/gradio_api/queue/join", join)[0] for _ in range(40)]
          assert 429 in codes and codes.count(200) <= 30, codes
          print("space ok:", json.dumps(health["recordings"]))
          PY
          # ZeroGPU stops a Space that sends no startup report; under spaces 0.51.3 the app sends it, once
          test "$(grep -c "POST /startup-report" "$RUNNER_TEMP/device-api.log")" = 1
          grep -q "event=zerogpu_startup_report sent_by=app" "$RUNNER_TEMP/space.log"
          grep -q "event=page_event_error error=ValueError" "$RUNNER_TEMP/space.log"
          # ZeroGPU stops a Space at startup unless a Gradio handler carries @spaces.GPU
          grep -q "event=page_built gpu_handlers=1" "$RUNNER_TEMP/space.log"
          if grep -E 'canary-|185\.220\.101\.45|No corpus matches for alert|Triage failed:|JSON parse failed|Exception in ASGI application|Traceback|Received inputs' "$RUNNER_TEMP/space.log"; then echo "alert text, an unredacted engine message or an error reached the logs"; exit 1; fi

      - name: Newest spaces still sends exactly one startup report
        run: |
          # From 0.52, spaces sends the report itself for a mounted app; the app must not send a second
          pip install -U spaces
          python -c "
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def ok(self):
                  print(self.command, self.path, flush=True)
                  self.send_response(200); self.end_headers(); self.wfile.write(b'{}')
              do_GET = do_POST = ok
              def log_message(self, *a): pass
          HTTPServer(('127.0.0.1', 7897), H).serve_forever()" > "$RUNNER_TEMP/device-api-new.log" 2>&1 &
          cd "$RUNNER_TEMP/space"
          trap 'echo "--- app log"; tail -40 "$RUNNER_TEMP/space-new.log"; cat "$RUNNER_TEMP/device-api-new.log"' ERR
          PYTHONUNBUFFERED=1 SPACES_ZERO_GPU=true SPACES_ZERO_DEVICE_API_URL=http://127.0.0.1:7897 \
            GRADIO_SERVER_PORT=7862 python app.py > "$RUNNER_TEMP/space-new.log" 2>&1 &
          for i in $(seq 1 90); do curl -fs localhost:7862/healthz | grep -q '"replay"' && break; sleep 2; done
          curl -fs localhost:7862/healthz; echo
          pip show spaces | grep -i "^version"
          test "$(grep -c "POST /startup-report" "$RUNNER_TEMP/device-api-new.log")" = 1
          grep -q "event=page_built gpu_handlers=1" "$RUNNER_TEMP/space-new.log"
