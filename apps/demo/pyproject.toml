[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-demo"
version = "0.1.0"
description = "Public demo mode for SOC Triage AI: stateless POST /triage with rate limits and a daily token cap."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37"]

[tool.hatch.build.targets.wheel]
packages = ["soc_demo"]
