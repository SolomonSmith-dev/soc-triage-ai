[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-demo"
version = "0.2.0"
description = "Public demo for SOC Triage AI: POST /triage on recorded model responses by default, or live with rate limits and a daily token cap. Streamlit page for local and Docker runs, Gradio page for the ZeroGPU Space."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37"]
# the Gradio page for the ZeroGPU Space; keep equal to sdk_version in deploy/hf-space-zerogpu/README.md
space = ["gradio==6.32.0"]

[tool.hatch.build.targets.wheel]
packages = ["soc_demo"]
