[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-demo"
version = "0.2.0"
description = "Public demo for SOC Triage AI: POST /triage on recorded model responses by default, or live with rate limits and a daily token cap."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37"]

[tool.hatch.build.targets.wheel]
packages = ["soc_demo"]
