# Runs as the unprivileged container user, so every writable path is under /tmp.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
  access_log off;   # no request logging: nothing about visitors or alerts is written
  client_body_temp_path /tmp/nginx_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;
  client_max_body_size 64k;   # alerts are capped at a few thousand characters

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 7860;

    # API. X-Forwarded-For is passed through untouched: the Space proxy appends the real client
    # address on the right, and the app reads the right-most entry (DEMO_TRUSTED_PROXY_HOPS=1).
    location ~ ^/(triage|budget|healthz|docs|openapi.json)$ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # Streamlit UI, including its websocket
    location / {
      proxy_pass http://127.0.0.1:8501;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_read_timeout 86400;
    }
  }
}
